name: Avisos do Lume
# Reserva manual. O envio automático (a cada 1 minuto) roda no Google Apps Script
# "Avisos do Lumi" (cópia em assistente-lume-server/apps-script).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lume-avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assistente-lume-server/dispatcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        working-directory: assistente-lume-server/dispatcher
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Enviar avisos na hora
        working-directory: assistente-lume-server/dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send.js
