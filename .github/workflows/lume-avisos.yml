name: Avisos do Lume
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: lume-avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assistente-lume-server/dispatcher
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        working-directory: assistente-lume-server/dispatcher
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Enviar avisos na hora
        working-directory: assistente-lume-server/dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send.js
      - name: Manter a tarefa ativa
        # O GitHub pausa tarefas agendadas após 60 dias sem alterações no repositório.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/lume-avisos.yml/enable" || true
