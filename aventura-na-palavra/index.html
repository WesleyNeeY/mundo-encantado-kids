<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aventura"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Aventura na Palavra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1b3a">
<meta name="description" content="Quiz bíblico em 3D com o robô Teo, dentro de uma igreja cheia de luz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>/* Layout: igreja 3D em tela cheia; a interface flutua em cartões claros —
   painel de baixo no celular em pé, coluna à direita em telas largas. Visual único (claro, sem tema escuro). */
:root {
  --ink: #1a2944;
  --ink-soft: #4a5875;
  --paper: #fffdf8;
  --card: rgba(255, 252, 246, 0.93);
  --line: rgba(26, 41, 68, 0.12);
  --gold-1: #ffd96e;
  --gold-2: #f4a62a;
  --gold-ink: #4a2a00;
  --teal: #1ba9c9;
  --leaf: #23a865;
  --leaf-soft: #e3f7eb;
  --coral: #e8604f;
  --coral-soft: #fdeceb;
  --night: #0d1b3a;
  --a: #f4a62a;
  --b: #1ba9c9;
  --c: #e85d8f;
  --d: #7c63e8;
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --radius: 22px;
  --shadow: 0 18px 50px rgba(10, 20, 45, 0.28), 0 2px 8px rgba(10, 20, 45, 0.12);
  --hud-h: 58px;
  color-scheme: light;
}

html, body { height: 100%; overflow: hidden; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 95% at 50% 40%, rgba(0, 0, 0, 0) 55%, rgba(8, 14, 32, 0.38) 100%);
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; box-shadow: 0 0 0 6px rgba(27, 169, 201, 0.55); }

/* ---------------------------------------------------------------- botões */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; letter-spacing: 0.02em;
  border-radius: 999px; padding: 0.7em 1.6em; font-size: 1.1rem;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s;
}
.btn-gold {
  color: var(--gold-ink);
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  box-shadow: 0 5px 0 #c97f12, 0 12px 26px rgba(244, 166, 42, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.6);
}
.btn-gold:hover { filter: brightness(1.05); }
.btn-gold:active { transform: translateY(4px); box-shadow: 0 1px 0 #c97f12, 0 6px 14px rgba(244, 166, 42, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
.btn-big { font-size: clamp(1.25rem, 4.6vw, 1.5rem); padding: 0.62em 2.2em; }
.btn.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 5px 0 #c97f12, 0 12px 26px rgba(244, 166, 42, 0.45), 0 0 0 0 rgba(255, 214, 110, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
  50% { box-shadow: 0 5px 0 #c97f12, 0 12px 26px rgba(244, 166, 42, 0.45), 0 0 0 14px rgba(255, 214, 110, 0), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
}
.icon-btn {
  appearance: none; border: 0; cursor: pointer; display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.92); color: var(--ink);
  box-shadow: 0 4px 14px rgba(10, 20, 45, 0.22);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.small { width: 36px; height: 36px; box-shadow: none; background: rgba(27, 169, 201, 0.12); color: var(--teal); }
.icon-btn.small svg { width: 20px; height: 20px; }
#btn-sound .off { display: none; }
#btn-sound.off .on { display: none; }
#btn-sound.off .off { display: block; }

/* ---------------------------------------------------------------- abertura */
.splash {
  position: absolute; inset: 0; z-index: 30; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(130% 80% at 50% 108%, #f6b34a 0%, #c8642f 22%, #3a2f6b 48%, #0d1b3a 78%);
  color: #fff; text-align: center;
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.splash.leaving { opacity: 0; transform: scale(1.06); pointer-events: none; }
.splash-glow {
  position: absolute; left: 50%; top: 34%; width: 520px; height: 520px; max-width: 120vw; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255, 220, 140, 0.32), rgba(255, 220, 140, 0) 62%);
  pointer-events: none; animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.85; } }
.splash-inner { position: relative; display: grid; justify-items: center; gap: 14px; max-width: 440px; }
.logo-mark { width: 132px; height: auto; filter: drop-shadow(0 8px 24px rgba(255, 196, 80, 0.5)); animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.logo-title {
  margin: 0; font-family: var(--font-display); font-weight: 800; line-height: 0.95;
  font-size: clamp(2.6rem, 11vw, 3.6rem); letter-spacing: -0.01em; text-wrap: balance;
  text-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}
.logo-title span {
  display: block; background: linear-gradient(180deg, #fff1b8, #ffc348 70%, #f29a1e);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.splash-sub { margin: 0; font-weight: 800; font-size: 1.05rem; color: rgba(255, 255, 255, 0.86); }
.loader { display: grid; gap: 8px; justify-items: center; width: min(280px, 80vw); margin-top: 10px; }
.loader-bar { width: 100%; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
.loader-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffe7a1, #f4a62a); transform-origin: left; transform: scaleX(0.04); transition: transform 0.5s ease; border-radius: 99px; }
#loader-text { font-size: 0.92rem; font-weight: 700; color: rgba(255, 255, 255, 0.75); }
.splash.ready .loader { display: none; }
#btn-enter { margin-top: 10px; animation: rise 0.6s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.92); } }
.splash-hint { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font-size: 0.88rem; font-weight: 700; color: rgba(255, 255, 255, 0.72); }
.splash-hint svg { width: 20px; height: 20px; }

/* ---------------------------------------------------------------- barra do topo */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  opacity: 0; transform: translateY(-10px); transition: opacity 0.5s, transform 0.5s;
  pointer-events: none;
}
.hud.in { opacity: 1; transform: none; }
.hud > * { pointer-events: auto; }
.hud-brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45); white-space: nowrap; }
.hud-brand b { color: var(--gold-1); }
.progress { flex: 1; display: flex; justify-content: center; gap: 6px; min-width: 0; }
.progress .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); transition: transform 0.3s, background 0.3s; }
.progress .dot.now { background: #fff; transform: scale(1.35); box-shadow: 0 0 0 3px rgba(255, 217, 110, 0.75); }
.progress .dot.ok { background: var(--gold-1); }
.progress .dot.miss { background: #9fb1c9; }
.hud-right { display: flex; align-items: center; gap: 10px; }
.stars-pill {
  display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 10px; border-radius: 99px;
  background: rgba(255, 255, 255, 0.92); box-shadow: 0 4px 14px rgba(10, 20, 45, 0.22);
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stars-pill svg { width: 24px; height: 24px; fill: var(--gold-2); filter: drop-shadow(0 1px 1px rgba(150, 80, 0, 0.35)); }
.stars-pill.pop { animation: pop 0.45s cubic-bezier(.2, .9, .3, 1.6); }
@keyframes pop { 40% { transform: scale(1.25); } }

/* ---------------------------------------------------------------- balão de fala */
.bubble {
  position: absolute; left: 0; top: 0; z-index: 8; max-width: min(300px, calc(100vw - 32px));
  background: #fff; color: var(--ink); border-radius: 20px; padding: 12px 16px;
  box-shadow: 0 10px 30px rgba(10, 20, 45, 0.25);
  opacity: 0; transition: opacity 0.25s; pointer-events: none; will-change: transform;
  --tail-x: 40px;
}
.bubble.show { opacity: 1; }
.bubble p { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; line-height: 1.25; text-wrap: balance; }
.bubble::after {
  content: ""; position: absolute; left: var(--tail-x); bottom: -9px; width: 20px; height: 20px; margin-left: -10px;
  background: #fff; transform: rotate(45deg); border-radius: 0 0 5px 0;
}
.bubble.side::after { display: none; }
.bubble.pop p { animation: textIn 0.35s ease both; }
@keyframes textIn { from { opacity: 0; transform: translateY(4px); } }

/* ---------------------------------------------------------------- painéis */
.panel {
  position: absolute; z-index: 12; left: 0; right: 0; bottom: 0;
  margin: 0 auto; max-width: 560px; box-sizing: border-box;
  background: var(--card);
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  border-radius: 28px 28px 0 0; box-shadow: var(--shadow);
  padding-top: 18px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateY(30px); opacity: 0; transition: transform 0.45s cubic-bezier(.2, .9, .3, 1.1), opacity 0.35s;
}
.panel.in { transform: none; opacity: 1; }
.panel h2 { margin: 0; font-family: var(--font-display); font-weight: 800; color: var(--ink); text-wrap: balance; }
.eyebrow { margin: 0 0 2px; font-weight: 900; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); }
.muted { color: var(--ink-soft); font-weight: 700; margin: 6px 0 0; }

.start { text-align: center; display: grid; justify-items: center; gap: 6px; padding-top: 22px; }
.start h2 { font-size: clamp(1.6rem, 6vw, 2rem); line-height: 1.05; }
.start .btn { margin-top: 12px; }

/* pergunta */
.q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.q-num { font-weight: 900; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-right: auto; }
.chip { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 99px; font-weight: 800; font-size: 0.82rem; background: rgba(27, 169, 201, 0.12); color: #0f7f99; }
.chip-level[data-level="facil"] { background: var(--leaf-soft); color: #13804a; }
.chip-level[data-level="medio"] { background: #fff2d6; color: #a0620a; }
.chip-level[data-level="dificil"] { background: #f2e9ff; color: #6a46d6; }
.q-text { font-size: clamp(1.28rem, 5.1vw, 1.55rem); line-height: 1.18; margin: 0 0 12px; }
.answers { display: grid; gap: 9px; }
.answer {
  appearance: none; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 54px; padding: 8px 12px 8px 8px; border-radius: 16px;
  background: #ffffff; border: 2px solid var(--line); color: var(--ink);
  font-weight: 800; font-size: 1.06rem; line-height: 1.2;
  box-shadow: 0 2px 0 rgba(26, 41, 68, 0.08);
  transition: transform 0.15s ease, border-color 0.2s, background 0.25s, opacity 0.3s;
  opacity: 0; transform: translateY(10px);
}
.quiz.in .answer { opacity: 1; transform: none; transition-delay: var(--delay, 0ms); }
.answer:hover { border-color: rgba(27, 169, 201, 0.55); }
.answer:active { transform: scale(0.98); }
.answer .letter {
  flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: #fff;
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
}
.letter.l0 { background: var(--a); } .letter.l1 { background: var(--b); } .letter.l2 { background: var(--c); } .letter.l3 { background: var(--d); }
.answer .atext { flex: 1; min-width: 0; }
.answer .mark { flex: none; width: 26px; height: 26px; }
.answer .mark svg { width: 26px; height: 26px; }
.answers.locked .answer { cursor: default; transition-delay: 0s; }
.answer.right { background: var(--leaf-soft); border-color: var(--leaf); color: #0e5a33; animation: bounceIn 0.5s cubic-bezier(.2, .9, .3, 1.5); }
.answer.right .letter { background: var(--leaf); }
.answer.right .mark { color: var(--leaf); }
.answer.wrong { background: var(--coral-soft); border-color: var(--coral); color: #8a2a1f; animation: shake 0.45s ease; }
.answer.wrong .letter { background: var(--coral); }
.answer.wrong .mark { color: var(--coral); }
.answer.dim { opacity: 0.45 !important; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes bounceIn { 40% { transform: scale(1.04); } }
/* depois de responder: some com as alternativas que não importam, para caber a explicação */
.quiz.answered .answer.dim { display: none; }

.feedback { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--line); display: grid; gap: 8px; opacity: 0; transform: translateY(8px); transition: opacity 0.35s, transform 0.35s; }
.feedback.in { opacity: 1; transform: none; }
.fb-head { display: flex; align-items: center; gap: 10px; }
.fb-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.fb-icon svg { width: 22px; height: 22px; fill: #fff; }
.feedback.ok .fb-icon { background: linear-gradient(180deg, var(--gold-1), var(--gold-2)); box-shadow: 0 3px 10px rgba(244, 166, 42, 0.5); }
.feedback.bad .fb-icon { background: linear-gradient(180deg, #57c9e6, var(--teal)); box-shadow: 0 3px 10px rgba(27, 169, 201, 0.45); }
.fb-head strong { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.feedback.ok .fb-head strong { color: #b06a00; }
.feedback.bad .fb-head strong { color: #0f7f99; }
.fb-text { margin: 0; font-weight: 700; font-size: 1rem; line-height: 1.4; color: var(--ink); max-width: 65ch; }
.fb-ref { margin: 0; display: inline-flex; align-items: center; gap: 6px; justify-self: start; padding: 5px 12px 5px 9px; border-radius: 99px; background: #fff3d9; color: #8a4f00; font-weight: 900; font-size: 0.9rem; }
.fb-ref svg { width: 18px; height: 18px; }
.feedback .btn { justify-self: stretch; margin-top: 4px; }

/* fim */
.end { text-align: center; display: grid; justify-items: center; gap: 4px; padding-top: 22px; }
.end h2 { font-size: clamp(1.7rem, 6.4vw, 2.1rem); }
.end-stars { display: flex; gap: 10px; margin: 6px 0 2px; }
.big-star { width: 58px; height: 58px; opacity: 0.25; transform: scale(0.8); }
.big-star svg { width: 100%; height: 100%; fill: #c8d2e0; }
.big-star.on { opacity: 1; animation: starIn 0.6s cubic-bezier(.2, .9, .3, 1.6) both; animation-delay: var(--delay, 0ms); }
.big-star.on svg { fill: var(--gold-2); filter: drop-shadow(0 4px 8px rgba(244, 166, 42, 0.55)); }
@keyframes starIn { from { opacity: 0; transform: scale(0.2) rotate(-60deg); } to { opacity: 1; transform: scale(1); } }
.end-text { margin: 0; font-weight: 800; font-size: 1.1rem; }
.end-total { margin: 0 0 10px; }

/* pular abertura, estrela voando */
.skip {
  position: absolute; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px);
  appearance: none; border: 0; cursor: pointer; padding: 8px 16px; border-radius: 99px;
  background: rgba(13, 27, 58, 0.55); color: #fff; font-weight: 800; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.fly-layer { position: absolute; inset: 0; pointer-events: none; z-index: 25; }
.fly-star { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
.fly-star svg { width: 100%; height: 100%; fill: var(--gold-1); filter: drop-shadow(0 0 8px rgba(255, 200, 80, 0.9)); }

/* ---------------------------------------------------------------- telas largas: painel à direita */
@media (min-width: 900px) and (min-aspect-ratio: 23/20) {
  :root { --panel-w: min(440px, 38vw); }
  .panel {
    left: auto; right: max(24px, env(safe-area-inset-right, 0px)); bottom: auto; top: 50%;
    width: var(--panel-w); max-width: none; margin: 0;
    border-radius: 28px; padding: 22px 22px 22px;
    transform: translate(30px, -50%); max-height: calc(100vh - 120px); overflow: auto;
  }
  .panel.in { transform: translate(0, -50%); }
  .hud-brand { font-size: 1.15rem; }
}
@media (max-width: 899px), (max-aspect-ratio: 23/20) {
  .hud-brand { display: none; }
  .progress { justify-content: flex-start; }
}
@media (max-height: 640px) and (max-width: 899px) {
  .q-text { font-size: 1.18rem; margin-bottom: 8px; }
  .answer { min-height: 46px; font-size: 1rem; }
  .answer .letter { width: 32px; height: 32px; }
  .panel { padding-top: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
[hidden] { display: none !important; }
</style>

<div id="app">
  <canvas id="scene" aria-label="Igreja em 3D com o robô Teo no palco"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <section id="splash" class="splash" aria-label="Abertura">
    <div class="splash-glow" aria-hidden="true"></div>
    <div class="splash-inner">
      <svg class="logo-mark" viewBox="0 0 120 96" aria-hidden="true">
        <defs>
          <linearGradient id="lg-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a1"/><stop offset="1" stop-color="#f2a52b"/></linearGradient>
          <radialGradient id="lg-glow" cx="0.5" cy="0.62" r="0.6"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd36a" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="60" cy="54" rx="58" ry="40" fill="url(#lg-glow)"/>
        <g stroke="#ffe7a1" stroke-width="3.4" stroke-linecap="round" opacity="0.9">
          <path d="M60 30V8"/><path d="M44 33L34 15"/><path d="M76 33l10-18"/><path d="M31 41L15 30"/><path d="M89 41l16-11"/>
        </g>
        <path d="M60 86C48 78 30 76 14 79V44c16-3 34-1 46 8z" fill="url(#lg-gold)"/>
        <path d="M60 86c12-8 30-10 46-7V44c-16-3-34-1-46 8z" fill="url(#lg-gold)"/>
        <path d="M60 52v34" stroke="#b86d0c" stroke-width="3"/>
        <path d="M22 54c10-1 20 0 30 4M22 63c10-1 20 0 30 4M68 58c10-4 20-5 30-4M68 67c10-4 20-5 30-4" stroke="#c98415" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.65"/>
      </svg>
      <h1 class="logo-title">Aventura <span>na Palavra</span></h1>
      <p class="splash-sub">Quiz bíblico em 3D com o robô Teo</p>
      <div class="loader" role="status" aria-live="polite">
        <div class="loader-bar"><i id="loader-fill"></i></div>

  return col;
}
