<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lumi · Inglês para crianças</title>
<meta name="description" content="Aprenda inglês brincando com o Lumi: escute, repita e jogue com seu amiguinho em 3D.">
<meta name="theme-color" content="#4fb4ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{
  --ink:#16295e; --muted:#5d6fa3; --line:#dfe8fb;
  --blue:#2f86ff; --blueD:#1a5fd1; --green:#34c96b; --greenD:#1f9a4c; --red:#ff5d73; --redD:#d43a52;
  --yellow:#ffc928; --yellowD:#e09a00; --purple:#9a63ff; --purpleD:#6d3ae0; --orange:#ff9a3c; --orangeD:#e0701a; --pink:#ff6fae; --pinkD:#d84688;
  --font:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0e2a63;font-family:var(--font);color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:#bfe6ff}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.host{position:absolute;inset:0;z-index:1}
.host canvas{display:block;touch-action:manipulation}
.ui{position:relative;z-index:2;pointer-events:none}
.ui *{pointer-events:auto}

/* fundos */
.sky{background:radial-gradient(120% 60% at 80% 0%,#fff6c9 0%,rgba(255,246,201,0) 45%),linear-gradient(180deg,#46a9ff 0%,#8fd0ff 38%,#d3f0ff 64%,#eefaff 100%)}
.night{background:radial-gradient(90% 50% at 80% 8%,#5a5fc7 0%,rgba(90,95,199,0) 60%),linear-gradient(180deg,#0f1b4d 0%,#26307a 55%,#4b3c96 100%);color:#fff}
.candy{background:linear-gradient(180deg,#ffd8b0 0%,#ffeedd 45%,#fff8ef 100%)}
.grape{background:linear-gradient(180deg,#cdb6ff 0%,#eadfff 45%,#f8f4ff 100%)}
.lessonbg{background:radial-gradient(110% 55% at 50% 22%,#ffffff 0%,rgba(255,255,255,0) 60%),linear-gradient(180deg,#69bdff 0%,#a9dcff 40%,#e3f5ff 100%)}
.clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9;filter:drop-shadow(0 6px 10px rgba(40,110,200,.12))}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;top:-70%}
.cloud::after{width:42%;height:130%;right:10%;top:-48%}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.twinkle{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}

/* topo */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;height:40px;background:rgba(255,255,255,.95);border-radius:999px;padding:0 12px 0 6px;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(20,60,140,.12),0 8px 18px rgba(20,60,140,.12)}
.pill .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.ic.coin{background:radial-gradient(circle at 35% 30%,#fff5b0,#ffc21a 60%,#e39100);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);color:#8a5200;font-size:14px;font-weight:700}
.ic.bolt{background:linear-gradient(180deg,#7cf0a0,#2fc46a)}
.ic.fire{background:linear-gradient(180deg,#ffb36b,#ff6a3d)}
.lvl{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 4px 0 rgba(20,60,140,.12),0 8px 18px rgba(20,60,140,.12)}
.lvl .b{width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#ffdf6b,#ffb000);display:grid;place-items:center;font-weight:700;color:#7a4700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.lvl .t{display:flex;flex-direction:column;gap:3px;min-width:70px}
.lvl .t b{font-size:14px;line-height:1}
.xpbar{height:8px;border-radius:9px;background:#e1ebfb;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#4fc3ff,#2f86ff);border-radius:9px;transition:width .6s}
.round{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(20,60,140,.15),0 8px 18px rgba(20,60,140,.12)}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,60,140,.15)}

/* botões grandes */
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:68px;border-radius:26px;font-size:26px;font-weight:700;color:#fff;letter-spacing:.3px;background:linear-gradient(180deg,#5ee28b,#2fc46a);box-shadow:0 7px 0 var(--greenD),0 14px 24px rgba(20,120,60,.28);text-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--greenD)}
.big.yellow{background:linear-gradient(180deg,#ffdc5c,#ffbf1a);color:#6d4300;box-shadow:0 7px 0 var(--yellowD),0 14px 24px rgba(160,100,0,.25);text-shadow:none}
.big.yellow:active{box-shadow:0 2px 0 var(--yellowD)}
.big.blue{background:linear-gradient(180deg,#5fb0ff,#2f86ff);box-shadow:0 7px 0 var(--blueD),0 14px 24px rgba(20,80,180,.28)}
.big.blue:active{box-shadow:0 2px 0 var(--blueD)}
.big.sm{height:54px;font-size:20px;border-radius:20px}
.big small{font-size:15px;font-weight:600;opacity:.9}
.play{flex-direction:column;gap:0;height:84px;line-height:1.05}
.play .l1{font-size:32px}
.play .l2{font-size:14.5px;font-weight:600;opacity:.95}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}

/* balão */
.bubble{position:absolute;left:50%;transform:translateX(-50%);max-width:86%;background:#fff;border-radius:22px;padding:10px 16px;font-weight:600;font-size:18px;line-height:1.25;text-align:center;box-shadow:0 6px 0 rgba(20,60,140,.08),0 10px 24px rgba(20,60,140,.16);z-index:4;color:var(--ink);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:18px;height:18px;margin-left:-9px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bubble:empty{display:none}
.bubble.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.5);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.bubble .en{color:var(--blue);font-weight:700}

/* home */
.homeacts{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.acts{display:flex;justify-content:space-between;gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;font-size:13.5px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(10,40,100,.35)}
.act .c{width:62px;height:62px;border-radius:22px;display:grid;place-items:center;font-size:30px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 10px 18px rgba(20,60,140,.2);border:3px solid rgba(255,255,255,.85)}
.act:active .c{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.c.map{background:linear-gradient(180deg,#7fd0ff,#2f86ff)}
.c.food{background:linear-gradient(180deg,#ffbd80,#ff7a3c)}
.c.moon{background:linear-gradient(180deg,#9b8cff,#5b45d6)}
.c.hat{background:linear-gradient(180deg,#ff9fd0,#ff5aa5)}
.c.gift{background:linear-gradient(180deg,#ffe36b,#ffb000)}
.glow .c{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,214,60,.55),0 5px 0 rgba(0,0,0,.18)}}
.brand{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));text-align:center;z-index:2;pointer-events:none}
.logo{font-size:44px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:0 4px 0 #2a72e6,0 10px 22px rgba(20,60,140,.3)}
.logo i{font-style:normal;color:var(--yellow);font-size:30px;vertical-align:top}

/* lição */
.ltop{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;position:relative;z-index:3}
.stars{flex:1;display:flex;justify-content:center;gap:4px}
.stars span{width:26px;height:26px;display:grid;place-items:center;font-size:22px;filter:grayscale(1) brightness(1.6) opacity(.55);transition:.35s cubic-bezier(.2,1.6,.4,1)}
.stars span.on{filter:none;transform:scale(1.15)}
.lstage{position:relative;height:42%;flex:none;z-index:1}
.lstage .host{inset:0}
.lstage .bubble{top:6px}
.lbody{flex:1;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card{position:relative;width:100%;max-width:360px;background:#fff;border-radius:32px;padding:16px 16px 18px;text-align:center;box-shadow:0 8px 0 #cfe0fb,0 18px 34px rgba(20,60,140,.18)}
.card.in{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:translateY(40px) scale(.7);opacity:0}}
.pic{font-size:min(26vw,118px);line-height:1.1;filter:drop-shadow(0 8px 8px rgba(20,60,140,.18))}
.pic .num{font-weight:700;color:var(--blue);font-size:min(30vw,128px);text-shadow:0 6px 0 #cfe3ff}
.pic.bounce{animation:picb .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes picb{40%{transform:scale(1.2) rotate(-6deg)}}
.wen{font-size:42px;font-weight:700;color:var(--blue);line-height:1.05;margin-top:4px}
.wpt{font-size:18px;color:var(--muted);font-weight:600}
.card .spk{position:absolute;right:12px;top:12px}
.spk{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#5fb0ff,#2f86ff);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 var(--blueD)}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blueD)}
.turn{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:flex-end}
.mic{position:relative;width:104px;height:104px;border-radius:50%;background:linear-gradient(180deg,#ff8aa0,#ff4f6a);box-shadow:0 7px 0 var(--redD),0 14px 24px rgba(200,40,70,.3);display:grid;place-items:center;font-size:46px;color:#fff;transition:transform .2s}
.mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--redD)}
.mic.listen{animation:micb .9s ease-in-out infinite}
.mic.listen::before,.mic.listen::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px solid rgba(255,90,115,.55);animation:ring 1.4s ease-out infinite}
.mic.listen::after{animation-delay:.7s}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes micb{50%{transform:scale(1.07)}}
.mic.idle{background:linear-gradient(180deg,#d9e3f5,#b9c7e2);box-shadow:0 7px 0 #94a5c8;color:#fff}
.turnlbl{font-size:22px;font-weight:700;color:var(--ink);text-align:center;min-height:28px}
.turnlbl .en{color:var(--red)}
.said{display:none}
.skip{font-size:15px;font-weight:600;color:var(--muted);padding:6px 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:380px;margin-top:6px}
.tile{aspect-ratio:1;border-radius:28px;background:#fff;display:grid;place-items:center;font-size:min(15vw,64px);box-shadow:0 7px 0 #cfe0fb,0 14px 24px rgba(20,60,140,.14);animation:cardIn .45s cubic-bezier(.2,1.5,.4,1) backwards}
.tile:nth-child(2){animation-delay:.08s}.tile:nth-child(3){animation-delay:.16s}
.tile .num{font-weight:700;color:var(--blue);font-size:min(15vw,64px)}
.tile.ok{background:#dcfbe7;box-shadow:0 7px 0 var(--green),0 14px 24px rgba(20,140,60,.25);transform:scale(1.08)}
.tile.bad{background:#ffe6ea;box-shadow:0 7px 0 var(--red);animation:shake .45s}
.tile.dim{opacity:.35;pointer-events:none;animation:none}
.tile.ok{animation:none}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.qtitle{font-size:24px;font-weight:700;text-align:center;margin:6px 0 4px}
.qtitle .en{color:var(--blue)}
.coinfly{position:absolute;z-index:50;pointer-events:none;font-weight:700;color:#c88400;font-size:24px;text-shadow:0 2px 0 #fff;animation:fly 1s ease-out forwards}
@keyframes fly{to{opacity:0;transform:translateY(-80px) scale(1.4)}}

/* resultado */
.rbox{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.rtitle{position:absolute;left:0;right:0;top:calc(30px + env(safe-area-inset-top,0px));z-index:3;text-align:center}
.rtitle h1{margin:0;font-size:38px;color:#fff;text-shadow:0 4px 0 #2a72e6,0 10px 22px rgba(20,60,140,.3)}
.big3{display:flex;justify-content:center;gap:8px;font-size:58px;margin-top:6px}
.big3 span{filter:grayscale(1) opacity(.4);transform:scale(.5);transition:.5s cubic-bezier(.2,1.6,.4,1)}
.big3 span.on{filter:drop-shadow(0 6px 6px rgba(160,100,0,.35));transform:scale(1)}
.big3 span:nth-child(2){transform:translateY(-14px) scale(.5)}
.big3 span:nth-child(2).on{transform:translateY(-14px) scale(1.15)}
.rewards{display:flex;gap:12px}
.reward{background:#fff;border-radius:20px;padding:10px 18px;font-weight:700;font-size:22px;box-shadow:0 5px 0 #cfe0fb;display:flex;align-items:center;gap:8px}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* descanso / lanche / loja */
.ptitle{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0}
.ptitle h1{margin:0;font-size:26px;font-weight:700}
.night .ptitle h1{color:#fff}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);border-radius:30px 30px 0 0;box-shadow:0 -8px 30px rgba(20,60,140,.15);backdrop-filter:blur(8px)}
.night .panel{background:rgba(25,30,90,.6);border:1px solid rgba(255,255,255,.15)}
.ebar{display:flex;align-items:center;gap:10px;font-weight:700}
.ebar .track{flex:1;height:20px;border-radius:12px;background:#e1ebfb;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.night .ebar .track{background:rgba(255,255,255,.18)}
.ebar .track i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,#7cf0a0,#2fc46a);transition:width .6s}
.hint{text-align:center;font-weight:500;font-size:15px;margin:10px 0 12px;color:var(--muted)}
.night .hint{color:#c9d3ff}
.zzz{position:absolute;z-index:3;left:58%;top:30%;font-weight:700;color:#fff;font-size:30px;pointer-events:none;display:none}
.zzz.on{display:block}
.zzz span{position:absolute;animation:zz 2.6s ease-out infinite;opacity:0}
.zzz span:nth-child(2){animation-delay:.9s;font-size:24px}.zzz span:nth-child(3){animation-delay:1.8s;font-size:18px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(40px,-90px)}}
.foods{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.foods::-webkit-scrollbar{display:none}
.food{flex:none;width:96px;background:#fff;border-radius:24px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 #f3d6b8,0 10px 18px rgba(160,90,30,.12)}
.food:active{transform:translateY(3px)}
.food .em{font-size:46px;line-height:1.1}
.food b{font-size:16px;color:var(--orangeD)}
.food .pr{display:flex;gap:6px;font-size:13px;font-weight:700}
.flyfood{position:fixed;z-index:40;font-size:56px;pointer-events:none;transition:transform .7s cubic-bezier(.3,-.4,.6,1),opacity .2s .6s}
.tabs{display:flex;gap:8px;margin:0 -14px 10px;padding:0 14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:0 14px;white-space:nowrap;height:44px;border-radius:16px;background:#f1ecff;font-weight:700;font-size:15px;color:var(--purpleD)}
.tab.on{background:linear-gradient(180deg,#b48cff,#8a55ff);color:#fff;box-shadow:0 4px 0 var(--purpleD)}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-height:calc(44vh - 70px);overflow-y:auto;padding:2px 2px 8px;margin:0 -2px}
.item{background:#fff;border-radius:20px;padding:4px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #e2d6ff;border:3px solid transparent;position:relative}
.item.sel{border-color:var(--purple)}
.item.wear{background:#f3edff}
.item img{width:66px;height:66px;object-fit:contain}
.item small{font-size:11px;font-weight:600;line-height:1.1;text-align:center;color:var(--muted);min-height:24px;display:flex;align-items:center}
.item .none{width:62px;height:62px;display:grid;place-items:center;font-size:30px;opacity:.5}
.item .tag{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff3c4;color:#8a5200}
.item .tag.own{background:#dcfbe7;color:#127a49}
.item .tag.wearing{background:var(--purple);color:#fff}

/* mapa */
.mapscroll{flex:1;overflow-y:auto;position:relative;z-index:2;-webkit-overflow-scrolling:touch}
.mapwrap{position:relative;margin:0 auto;width:100%;max-width:420px}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:130px}
.node .disc{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:linear-gradient(180deg,#ffffff,#e9f1ff);box-shadow:0 8px 0 #b8c9ea,0 14px 22px rgba(20,60,140,.22);border:5px solid #fff;position:relative}
.node.done .disc{background:linear-gradient(180deg,#8ff0ad,#2fc46a);box-shadow:0 8px 0 var(--greenD),0 14px 22px rgba(20,60,140,.22)}
.node.cur .disc{background:linear-gradient(180deg,#ffe27a,#ffb000);box-shadow:0 8px 0 var(--yellowD),0 0 0 8px rgba(255,255,255,.55),0 14px 22px rgba(20,60,140,.25);animation:nb 1.4s ease-in-out infinite}
.node.lock .disc{filter:grayscale(1);opacity:.75}
@keyframes nb{50%{transform:translateY(-7px)}}
.node .n{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 3px 0 var(--blueD)}
.node .lk{position:absolute;bottom:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.node label{background:#fff;border-radius:14px;padding:3px 12px;font-weight:700;font-size:14px;box-shadow:0 3px 0 #cfe0fb;white-space:nowrap}
.node .st{font-size:14px;height:16px;letter-spacing:-1px}
.mapav{position:absolute;width:96px;height:96px;pointer-events:none;transform:translate(-50%,-100%);filter:drop-shadow(0 8px 8px rgba(20,60,140,.25))}

/* splash */
.splashui{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.splashui input{width:100%;max-width:340px;height:60px;border-radius:22px;border:4px solid #fff;font:600 22px var(--font);text-align:center;color:var(--ink);outline:none;box-shadow:0 6px 0 rgba(20,60,140,.15);-webkit-user-select:text;user-select:text}
.splashui input:focus{border-color:var(--yellow)}
.splashui .big{max-width:340px}
.tagline{font-size:18px;font-weight:600;color:#fff;text-shadow:0 2px 6px rgba(10,40,100,.4)}

/* modal / toast */
.modal{position:absolute;inset:0;z-index:60;background:rgba(10,25,70,.5);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0;font-size:24px;text-align:center}
.sheet p{margin:0;text-align:center;color:var(--muted);font-weight:500;font-size:16px}
.row{display:flex;gap:10px}
.toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:10px 16px;border-radius:16px;font-weight:600;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.loading{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,#46a9ff,#bfe6ff);color:#fff;font-size:22px;font-weight:700;transition:opacity .4s}
.loading.off{opacity:0;pointer-events:none}
.nogl{padding:30px;text-align:center}

/* mundos no mapa */
.band{position:absolute;left:-20px;right:-20px;pointer-events:none}
.wban{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:8px 18px 8px 8px;box-shadow:0 6px 0 color-mix(in srgb,var(--wc) 55%,#000 0%),0 12px 22px rgba(20,60,140,.2);border:4px solid var(--wc);z-index:2;white-space:nowrap}
.wban .wi{width:48px;height:48px;border-radius:16px;background:var(--wc);display:grid;place-items:center;font-size:28px}
.wban b{display:block;font-size:17px}
.wban small{font-size:13px;color:var(--muted);font-weight:600}
.node.game .disc{background:linear-gradient(180deg,#ffb3dc,#ff6fae);box-shadow:0 8px 0 var(--pinkD),0 14px 22px rgba(20,60,140,.22)}
.node.game.done .disc{background:linear-gradient(180deg,#ffd0ea,#ff8cc1)}
.node.game.cur .disc{background:linear-gradient(180deg,#ffe27a,#ffb000)}
.wcard{margin-top:24px;width:100%;max-width:330px;background:#fff;border-radius:32px;padding:20px;text-align:center;border:6px solid var(--wc);box-shadow:0 10px 0 rgba(20,60,140,.12)}
.wcard.in{animation:cardIn .5s cubic-bezier(.2,1.5,.4,1)}
.wcard .wic{font-size:80px;line-height:1.1}
.wcard b{color:var(--muted);font-size:17px}
.wcard h2{margin:2px 0 0;font-size:34px;color:var(--wc)}
.ghint{margin:4px 0 0;text-align:center;color:var(--muted);font-weight:600;font-size:15px}
.card.simon .pic{font-size:min(24vw,104px)}
/* balões */
.bplay{position:relative;flex:1;width:calc(100% + 32px);margin:0 -16px;overflow:hidden}
.bspk{position:absolute;right:12px;top:8px;z-index:3}
.balloon{position:absolute;left:0;top:0;width:88px;height:108px;border-radius:50% 50% 47% 47% / 55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 8%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 45%,var(--bc) 55%,color-mix(in srgb,var(--bc) 70%,#000) 100%);display:grid;place-items:center;will-change:transform;box-shadow:inset -8px -10px 18px rgba(0,0,0,.12)}
.balloon.white{box-shadow:inset -8px -10px 18px rgba(0,0,0,.12),0 0 0 3px #cfd8ea}
.balloon::after{content:"";position:absolute;left:50%;bottom:-34px;width:2px;height:34px;background:rgba(40,60,100,.45)}
.balloon::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom-color:var(--bc);transform:rotate(180deg) translateY(-6px)}
.balloon span{font-size:44px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.balloon b{font-size:46px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.balloon.pop{animation:popb .35s ease-out forwards}
@keyframes popb{60%{scale:1.35;opacity:.9}100%{scale:1.6;opacity:0}}
.balloon.wob{animation:wob .5s}
@keyframes wob{25%{rotate:-14deg}50%{rotate:12deg}75%{rotate:-8deg}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;z-index:50;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
/* comida */
.tray{display:flex;justify-content:center;gap:14px;margin-top:auto;margin-bottom:10px;width:100%}
.fooditem{width:100px;height:100px;border-radius:30px;background:#fff;display:grid;place-items:center;font-size:62px;box-shadow:0 7px 0 #f3d6b8,0 14px 24px rgba(160,90,30,.15);touch-action:none;cursor:grab;position:relative;z-index:5}
.fooditem.drag{z-index:20;box-shadow:0 18px 30px rgba(20,60,140,.3)}
/* memória */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;margin-top:6px}
.mcard{position:relative;aspect-ratio:3/4;border-radius:20px;perspective:600px}
.mcard span{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .4s}
.mcard .back{background:linear-gradient(180deg,#b48cff,#8a55ff);box-shadow:0 6px 0 var(--purpleD);font-size:34px;color:#fff}
.mcard .face{background:#fff;box-shadow:0 6px 0 #cfe0fb;font-size:46px;transform:rotateY(180deg)}
.mcard .face .num{font-weight:700;color:var(--blue);font-size:40px}
.mcard.up .back{transform:rotateY(180deg)}
.mcard.up .face{transform:rotateY(360deg)}
.mcard.ok .face{background:#dcfbe7;box-shadow:0 6px 0 var(--green)}
.mcard.no .face{background:#ffe6ea;animation:shake .45s}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">

 <!-- SPLASH -->
 <section class="screen sky" id="s-splash">
  <div class="clouds" data-clouds></div>
  <div class="host" data-host></div>
  <div class="brand" style="top:calc(40px + env(safe-area-inset-top,0px))"><div class="logo">Lumi<i>★</i></div><div class="tagline">Aprenda inglês brincando!</div></div>
  <div class="splashui">
   <input id="kidname" maxlength="16" placeholder="Qual é o seu nome?" autocomplete="off">
   <button class="big" id="btn-start">Vamos lá! ▶</button>
  </div>
 </section>

 <!-- HOME -->
 <section class="screen sky" id="s-home">
  <div class="clouds" data-clouds></div>
  <div class="host" data-host></div>
  <div class="top ui">
   <div class="lvl"><div class="b" id="grow-ic">🍼</div><div class="t"><b id="home-name">Lumi</b><div class="xpbar"><i id="grow-bar"></i></div></div></div>
   <div class="spacer"></div>
   <div class="pill"><span class="ic coin">$</span><span data-bind="coins">0</span></div>
   <div class="pill"><span class="ic bolt">⚡</span><span data-bind="energy">0</span></div>
  </div>
  <div class="bubble pop" id="home-bubble" style="top:calc(78px + env(safe-area-inset-top,0px))"></div>
  <div class="homeacts">
   <div class="acts">
    <button class="act" data-go="map"><span class="c map">🗺️</span>Mapa</button>
    <button class="act" data-go="snack"><span class="c food">🍎</span>Lanche</button>
    <button class="act" id="btn-gift"><span class="c gift">🎁</span>Presente</button>
    <button class="act" data-go="rest"><span class="c moon">🌙</span>Dormir</button>
    <button class="act" data-go="shop"><span class="c hat">🎩</span>Roupas</button>
   </div>
   <button class="big play pulse" id="btn-play"><span class="l1">▶ JOGAR</span><span class="l2" id="play-sub">Aula 1 · Primeiras palavras</span></button>
  </div>
 </section>

 <!-- MAP -->
 <section class="screen sky" id="s-map">
  <div class="clouds" data-clouds></div>
  <div class="ptitle"><button class="round" data-go="home" aria-label="Voltar">←</button><h1 style="color:#fff;text-shadow:0 3px 0 #2a72e6">Mapa de Aventuras</h1></div>
  <div class="mapscroll" id="map-scroll"><div class="mapwrap" id="mapwrap"></div></div>
 </section>

 <!-- LESSON -->
 <section class="screen lessonbg" id="s-lesson">
  <div class="ltop">
   <button class="round" id="btn-quit" aria-label="Sair">✕</button>
   <div class="stars" id="stars"></div>
   <div class="pill"><span class="ic coin">$</span><span data-bind="coins">0</span></div>
  </div>
  <div class="lstage"><div class="host" data-host></div><div class="bubble pop" id="lesson-bubble"></div></div>
  <div class="lbody" id="lbody"></div>
 </section>

 <!-- RESULT -->
 <section class="screen sky" id="s-result">
  <div class="clouds" data-clouds></div>
  <div class="host" data-host></div>
  <div class="rtitle"><h1 id="result-title">Aula completa!</h1><div class="big3" id="result-stars"><span>⭐</span><span>⭐</span><span>⭐</span></div></div>
  <div class="rbox">
   <div class="rewards"><div class="reward"><span class="ic coin" style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center">$</span>+<span id="result-coins">0</span></div><div class="reward">✨ +<span id="result-xp">0</span> XP</div></div>
   <button class="big" id="btn-result">Continuar ▶</button>
  </div>
 </section>

 <!-- REST -->
 <section class="screen night" id="s-rest">
  <div class="clouds" data-stars></div>
  <div class="host" data-host></div>
  <div class="ptitle"><button class="round" data-go="home" aria-label="Voltar">←</button><h1>Hora de dormir</h1></div>
  <div class="bubble pop" id="rest-bubble" style="top:calc(76px + env(safe-area-inset-top,0px))"></div>
  <div class="zzz" id="zzz"><span>Z</span><span>z</span><span>z</span></div>
  <div class="panel">
   <div class="ebar"><span style="font-size:24px">⚡</span><div class="track"><i data-bind-w="energy"></i></div><span><span data-bind="energy">0</span>/100</span></div>
   <p class="hint" id="rest-hint"></p>
   <button class="big yellow" id="btn-sleep">🌙 Dormir</button>
  </div>
 </section>

 <!-- SNACK -->
 <section class="screen candy" id="s-snack">
  <div class="host" data-host></div>
  <div class="ptitle"><button class="round" data-go="home" aria-label="Voltar">←</button><h1>Lanchinho</h1><div class="spacer"></div><div class="pill"><span class="ic coin">$</span><span data-bind="coins">0</span></div></div>
  <div class="bubble pop" id="snack-bubble" style="top:calc(76px + env(safe-area-inset-top,0px))"></div>
  <div class="panel">
   <div class="ebar" style="margin-bottom:12px"><span style="font-size:24px">⚡</span><div class="track"><i data-bind-w="energy"></i></div><span><span data-bind="energy">0</span>/100</span></div>
   <div class="foods" id="foods"></div>
  </div>
 </section>

 <!-- SHOP -->
 <section class="screen grape" id="s-shop">
  <div class="host" data-host></div>
  <div class="ptitle"><button class="round" data-go="home" aria-label="Voltar">←</button><h1>Roupinhas</h1><div class="spacer"></div><div class="pill"><span class="ic coin">$</span><span data-bind="coins">0</span></div></div>
  <div class="bubble pop" id="shop-bubble" style="top:calc(76px + env(safe-area-inset-top,0px))"></div>
  <div class="panel">
   <div class="tabs" id="shop-tabs"></div>
   <div class="items" id="shop-items"></div>
  </div>
 </section>

 <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
 <div class="toast" id="toast"></div>
 <div class="loading" id="loading">Carregando o Lumi…</div>
</div>
<script src="data.js"></script>
<script src="lines.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
